<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Matcher</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; }
        .form-group { margin-bottom: 20px; }
        label { font-weight: bold; display: block; margin-bottom: 8px; color: #555; }
        textarea, input[type="file"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; }
        button:hover { background: #0056b3; }
        #loading { display: none; text-align: center; margin-top: 15px; font-weight: bold; color: #ff9800; }
        .card { background: #fff; border-left: 5px solid #007bff; margin-top: 15px; padding: 15px; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .score { font-size: 18px; font-weight: bold; color: #28a745; }
    </style>
</head>
<body>

<div class="container">
    <h1>📄 AI Resume Matcher</h1>
    
    <div class="form-group">
        <label for="jd">Job Description (JD):</label>
        <textarea id="jd" rows="5" placeholder="Paste Job Description here..."></textarea>
    </div>

    <div class="form-group">
        <label for="resumes">Upload Resumes (PDF / DOCX):</label>
        <input type="file" id="resumes" multiple accept=".pdf,.docx">
    </div>

    <button onclick="analyzeResumes()">Analyze Resumes</button>

    <div id="loading">⏳ Processing Resumes... Please wait.</div>
    <div id="results"></div>
</div>

<script>
async function analyzeResumes() {
    const jd = document.getElementById('jd').value;
    const fileInput = document.getElementById('resumes');
    const loading = document.getElementById('loading');
    const resultsDiv = document.getElementById('results');

    if (!jd || fileInput.files.length === 0) {
        alert("Please provide both Job Description and Resumes!");
        return;
    }

    const formData = new FormData();
    formData.append("job_description", jd);
    for (let file of fileInput.files) {
        formData.append("resumes", file);
    }

    loading.style.display = 'block';
    resultsDiv.innerHTML = '';

    try {
        // Backend API Link
        const response = await fetch('http://127.0.0.1:8000/analyze', {
            method: 'POST',
            body: formData
        });

        const result = await response.json();
        loading.style.display = 'none';

        if (result.status === 'success') {
            result.data.forEach(item => {
                resultsDiv.innerHTML += `
                    <div class="card">
                        <h3>${item.candidate_name || 'Candidate'}</h3>
                        <p class="score">Match Score: ${item.match_score}%</p>
                        <p><strong>Matching Skills:</strong> ${item.matching_skills.join(', ')}</p>
                        <p><strong>Missing Skills:</strong> ${item.missing_skills.join(', ')}</p>
                        <p><strong>Verdict:</strong> ${item.verdict}</p>
                    </div>
                `;
            });
        }
    } catch (err) {
        loading.style.display = 'none';
        alert("Error analyzing resumes. Check server console!");
        console.error(err);
    }
}
</script>

</body>
</html>
