<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Resume Matcher</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

background:linear-gradient(135deg,#4F46E5,#2563EB);
min-height:100vh;
padding:20px;

}

.container{

max-width:900px;
margin:auto;
background:white;
border-radius:20px;
padding:30px;
box-shadow:0 15px 40px rgba(0,0,0,.15);

}

h1{

text-align:center;
color:#1E293B;
margin-bottom:25px;

}

.form-group{

margin-bottom:25px;

}

label{

display:block;
margin-bottom:10px;
font-weight:600;
color:#334155;

}

textarea{

width:100%;
height:180px;
resize:vertical;
padding:15px;
border-radius:10px;
border:1px solid #CBD5E1;
font-size:15px;
outline:none;
transition:.3s;

}

textarea:focus{

border-color:#2563EB;
box-shadow:0 0 0 4px rgba(37,99,235,.15);

}

.upload-area{

border:2px dashed #2563EB;
border-radius:15px;
padding:35px;
text-align:center;
cursor:pointer;
transition:.3s;
background:#F8FAFC;

}

.upload-area:hover{

background:#EFF6FF;

}

.upload-area.dragover{

background:#DBEAFE;

}

.upload-area p{

color:#475569;

}

input[type=file]{

display:none;

}

button{

width:100%;
padding:15px;
font-size:17px;
font-weight:600;
border:none;
border-radius:10px;
background:#2563EB;
color:white;
cursor:pointer;
transition:.3s;

}

button:hover{

background:#1D4ED8;
transform:translateY(-2px);

}

button:active{

transform:scale(.98);

}

#loading{

display:none;
margin-top:20px;
text-align:center;

}

.spinner{

width:45px;
height:45px;
border:5px solid #E2E8F0;
border-top:5px solid #2563EB;
border-radius:50%;
margin:auto;
animation:spin 1s linear infinite;

}

@keyframes spin{

100%{

transform:rotate(360deg);

}

}

.card{

margin-top:20px;
padding:20px;
border-radius:15px;
background:#F8FAFC;
border-left:6px solid #2563EB;
animation:fade .4s;
word-wrap:break-word;

}

@keyframes fade{

from{

opacity:0;
transform:translateY(15px);

}

to{

opacity:1;
transform:translateY(0);

}

}

.score{

margin:15px 0;
height:14px;
background:#E2E8F0;
border-radius:20px;
overflow:hidden;

}

.progress{

height:100%;
background:linear-gradient(90deg,#22C55E,#16A34A);

}

.badge{

display:inline-block;
padding:6px 12px;
border-radius:30px;
background:#DCFCE7;
color:#15803D;
font-weight:600;
margin-top:10px;

}

ul{

padding-left:18px;

}

.file-list{

margin-top:15px;
font-size:14px;
color:#555;

}

@media(max-width:768px){

.container{

padding:18px;

}

h1{

font-size:26px;

}

textarea{

height:160px;

}

.upload-area{

padding:25px;

}

button{

font-size:16px;

}

}

</style>
</head>

<body>

<div class="container">

<h1>📄 AI Resume Matcher</h1>

<div class="form-group">

<label>Job Description</label>

<textarea id="jd" placeholder="Paste the Job Description here..."></textarea>

</div>

<div class="form-group">

<label>Upload Resume(s)</label>

<div class="upload-area" id="dropArea">

<p>📂 Drag & Drop Resume(s)</p>

<p>or Click to Browse</p>

<input type="file" id="resumes" multiple accept=".pdf,.docx">

<div class="file-list" id="fileList"></div>

</div>

</div>

<button onclick="analyzeResumes()">

Analyze Resumes

</button>

<div id="loading">

<div class="spinner"></div>

<p style="margin-top:12px;">Analyzing Resume...</p>

</div>

<div id="results"></div>

</div>

<script>

const API_URL="http://localhost:8000/analyze";

const dropArea=document.getElementById("dropArea");

const input=document.getElementById("resumes");

const fileList=document.getElementById("fileList");

dropArea.onclick=()=>input.click();

input.onchange=showFiles;

dropArea.addEventListener("dragover",e=>{

e.preventDefault();

dropArea.classList.add("dragover");

});

dropArea.addEventListener("dragleave",()=>{

dropArea.classList.remove("dragover");

});

dropArea.addEventListener("drop",e=>{

e.preventDefault();

dropArea.classList.remove("dragover");

input.files=e.dataTransfer.files;

showFiles();

});

function showFiles(){

let html="";

for(let file of input.files){

html+="📄 "+file.name+"<br>";

}

fileList.innerHTML=html;

}

async function analyzeResumes(){

const jd=document.getElementById("jd").value.trim();

if(jd==""||input.files.length==0){

alert("Please enter Job Description and upload resumes.");

return;

}

const loading=document.getElementById("loading");

const results=document.getElementById("results");

results.innerHTML="";

loading.style.display="block";

const formData=new FormData();

formData.append("job_description",jd);

for(let file of input.files){

formData.append("resumes",file);

}

try{

const response=await fetch(API_URL,{

method:"POST",

body:formData

});

const result=await response.json();

loading.style.display="none";

if(result.status==="success"){

result.data.forEach(item=>{

results.innerHTML+=`

<div class="card">

<h2>${item.candidate_name || "Candidate"}</h2>

<div class="score">

<div class="progress" style="width:${item.match_score}%"></div>

</div>

<h3>${item.match_score}% Match</h3>

<p><b>Matching Skills</b></p>

<ul>

${item.matching_skills.map(s=>`<li>${s}</li>`).join("")}

</ul>

<br>

<p><b>Missing Skills</b></p>

<ul>

${item.missing_skills.map(s=>`<li>${s}</li>`).join("")}

</ul>

<div class="badge">

${item.verdict}

</div>

</div>

`;

});

}else{

alert(result.message);

}

}catch(error){

loading.style.display="none";

alert("Server Error");

console.error(error);

}

}

</script>

</body>
</html>
